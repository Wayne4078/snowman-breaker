<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>눈사람 브레이커</title>
<link rel="preload" href="./fonts/jua-sb.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Jua';src:url('./fonts/jua-sb.woff2') format('woff2');font-display:block}
:root{--bg:#1b2a4a;--ink:#1b2440;--paper:#f4f1ea;--blue:#2f8cff;--gold:#ffd23f}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Jua","Arial Rounded MT Bold",system-ui,sans-serif}
canvas{display:block;position:fixed;inset:0}
/* 선배님 한마디 */
#fb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(8,10,25,.72);padding:16px;box-sizing:border-box}
#fb[hidden]{display:none}
#fb .card{width:min(100%,420px);background:var(--paper);color:var(--ink);border-radius:24px;padding:22px 20px 18px;box-sizing:border-box;box-shadow:0 14px 40px rgba(0,0,0,.45);position:relative}
#fb .bow{display:block;margin:-62px auto 4px;width:84px;height:84px}
#fb h2{margin:0 0 8px;font-size:24px;line-height:1.35;font-weight:400;text-align:center;word-break:keep-all}
#fb p{margin:0 0 16px;font-size:18px;line-height:1.5;text-align:center;color:#4a4f66;word-break:keep-all}
#fb .row{display:flex;flex-direction:column;gap:10px}
#fb button{font:inherit;font-size:21px;min-height:58px;border-radius:16px;border:0;cursor:pointer;color:var(--ink);background:#fff;box-shadow:inset 0 0 0 2px #d7d2c6}
#fb button.main{background:var(--blue);color:#fff;box-shadow:none}
#fb button.good{background:#e3f1ff}#fb button.meh{background:#fff6dc}#fb button.bad{background:#ffe8e6}
#fb button.later{background:none;box-shadow:none;color:#6b7088;font-size:19px;min-height:52px;margin-top:4px}
#fb .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#fb .chips button{flex:1 1 calc(50% - 10px);font-size:19px;padding:6px 8px;word-break:keep-all}
#fb textarea{width:100%;box-sizing:border-box;font:inherit;font-size:20px;line-height:1.4;border-radius:14px;border:2px solid #d7d2c6;padding:12px;min-height:110px;resize:none;margin-bottom:12px;color:var(--ink);background:#fff}
#fb .small{font-size:16px;color:#6b7088;margin:-6px 0 12px}
/* 이벤트 디버그(#events) */
#evp{position:fixed;left:4px;bottom:4px;z-index:60;max-width:60vw;font:11px/1.3 monospace;color:#bff;background:rgba(0,0,0,.7);padding:4px 6px;border-radius:6px;pointer-events:none;white-space:pre}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fb" hidden role="dialog" aria-modal="true"></div>
<script>
// playtest-kit v1 (테스터 링크에서만 켬)
(function(){
  var C = null, Q = [], timer = null, sess = Math.random().toString(36).slice(2, 10), t0 = Date.now();
  var pulsesShown = 0, lastPulse = -1e9, asked = {}, lastKey = "", lastData = null, bubble = null, hideT = null;
  function ls(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
  function tester(){
    var m = /[?&#]t=([^&#]+)/.exec(location.search + location.hash), t;
    if(m){ t = decodeURIComponent(m[1]).slice(0, 30); ls("pt_tester", t); }
    t = t || ls("pt_tester");
    if(!t){ t = "anon-" + Math.random().toString(36).slice(2, 7); ls("pt_tester", t); }
    if(/[?&#]dev\b/.test(location.search + location.hash) || document.documentElement.classList.contains("dev")) t = "dev:" + t;
    return t;
  }
  function row(kind, key, data){
    return {game:C.game, build:C.build, lang:C.lang, tester:C.tester, session:sess, kind:kind,
            key:(key || "").slice(0, 60), t_ms:Date.now() - t0, data:data || null};
  }
  function push(r){ Q.push(r); if(!timer) timer = setTimeout(flush, 8000); }
  function send(rows, beacon){
    if(!C || !C.endpoint || !rows.length) return Promise.resolve(true);
    var url = C.endpoint + "/rest/v1/playtest_log", body = JSON.stringify(rows);
    try{
      return fetch(url, {method:"POST", keepalive:!!beacon && body.length < 60000,
        headers:{"apikey":C.key, "Authorization":"Bearer " + C.key, "Content-Type":"application/json", "Prefer":"return=minimal"},
        body:body}).then(function(r){ return r.ok; }, function(){ return false; });
    }catch(e){ return Promise.resolve(false); }
  }
  function stash(rows){ try{ var o = JSON.parse(ls("pt_outbox") || "[]"); ls("pt_outbox", JSON.stringify(o.concat(rows).slice(-300))); }catch(e){} }
  function flush(beacon){
    clearTimeout(timer); timer = null;
    var rows = Q.splice(0);
    try{ var o = JSON.parse(ls("pt_outbox") || "[]"); if(o.length){ rows = o.concat(rows); ls("pt_outbox", "[]"); } }catch(e){}
    if(!rows.length) return Promise.resolve(true);
    return send(rows, beacon).then(function(ok){ if(!ok) stash(rows); return ok; });
  }
  function css(){
    if(document.getElementById("pt-css")) return;
    var s = document.createElement("style"); s.id = "pt-css";
    s.textContent = ".pt-bub{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));translate:-50% 12px;width:min(92vw,400px);box-sizing:border-box;z-index:9000;"
      + "background:var(--pt-bg,#F3ECDD);color:var(--pt-ink,#2A241C);border-radius:18px;padding:14px 16px 12px;box-shadow:0 10px 34px rgba(0,0,0,.45);opacity:0;transition:opacity .45s ease,translate .45s ease;font:inherit}"
      + ".pt-bub.on{opacity:1;translate:-50% 0}.pt-q{margin:0 26px 10px 0;font-size:16px;line-height:1.4}"
      + ".pt-x{position:absolute;right:8px;top:6px;width:32px;height:32px;border:0;background:none;color:inherit;opacity:.5;font-size:18px;cursor:pointer}"
      + ".pt-opts{display:flex;flex-wrap:wrap;gap:7px}.pt-o{border:1px solid rgba(42,36,28,.35);background:transparent;color:inherit;border-radius:999px;padding:9px 13px;font:inherit;font-size:14.5px;cursor:pointer;min-height:40px}"
      + ".pt-o:active{background:rgba(42,36,28,.12)}.pt-thx{margin:0;font-size:15px;opacity:.8}"
      + "@media (prefers-reduced-motion:reduce){.pt-bub{transition:none}}";
    document.head.appendChild(s);
  }
  function close(){ if(!bubble) return; var b = bubble; bubble = null; clearTimeout(hideT); b.classList.remove("on"); setTimeout(function(){ b.remove(); }, 500); }
  var PT = {
    init:function(o){
      C = {game:o.game, build:o.build || "", lang:o.lang || document.documentElement.lang || "", endpoint:o.endpoint, key:o.key,
           maxPulses:o.maxPulses || 3, gapMs:o.gapMs === undefined ? 180000 : o.gapMs, linger:o.linger || 14000,
           S:Object.assign({skip:"×", thanks:"고마워요."}, o.strings || {})};
      C.tester = tester();
      push(row("start", "start", {ua:navigator.userAgent.slice(0, 120), w:innerWidth, h:innerHeight, ref:document.referrer.slice(0, 80)}));
      flush();
      var leave = function(){ Q.push(row("exit", lastKey, {last:lastData, visible_s:Math.round((Date.now() - t0) / 1000)})); flush(true); };
      document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") leave(); });
      addEventListener("pagehide", leave);
      return C.tester;
    },
    event:function(key, data){ if(!C) return; lastKey = key; lastData = data || null; push(row("event", key, data)); },
    pulse:function(key, o){
      if(!C || asked[key] || pulsesShown >= C.maxPulses || Date.now() - lastPulse < C.gapMs) return false;
      asked[key] = 1;
      setTimeout(function(){
        if(bubble || document.visibilityState === "hidden") return;
        css(); pulsesShown++; lastPulse = Date.now();
        var b = document.createElement("div"); b.className = "pt-bub"; b.setAttribute("role", "dialog"); b.setAttribute("aria-live", "polite");
        var q = document.createElement("p"); q.className = "pt-q"; q.textContent = o.q; b.appendChild(q);
        var x = document.createElement("button"); x.type = "button"; x.className = "pt-x"; x.textContent = C.S.skip; x.setAttribute("aria-label", "skip");
        x.onclick = function(){ push(row("pulse", key, {skipped:1, ctx:o.ctx || null})); close(); }; b.appendChild(x);
        var w = document.createElement("div"); w.className = "pt-opts";
        o.opts.forEach(function(t, i){
          var btn = document.createElement("button"); btn.type = "button"; btn.className = "pt-o"; btn.textContent = t;
          btn.onclick = function(ev){
            ev.stopPropagation();
            push(row("pulse", key, {a:t, i:i, ms:Date.now() - lastPulse, ctx:o.ctx || null})); flush();
            b.innerHTML = ""; var th = document.createElement("p"); th.className = "pt-thx"; th.textContent = C.S.thanks; b.appendChild(th);
            clearTimeout(hideT); hideT = setTimeout(close, 900);
          };
          w.appendChild(btn);
        });
        b.appendChild(w); document.body.appendChild(b); bubble = b;
        requestAnimationFrame(function(){ b.classList.add("on"); });
        hideT = setTimeout(function(){ push(row("pulse", key, {ignored:1, ctx:o.ctx || null})); close(); }, C.linger);
      }, o.delay || 0);
      return true;
    },
    survey:function(key, answers){ if(!C) return Promise.resolve(false); Q.push(row("survey", key, answers)); return flush(); },
    flush:flush,
    tester:function(){ return C && C.tester; },
    closeBubble:close
  };
  window.PT = PT;
})();
</script>
<script>
// ================= 기본 설정 =================
const BUILD='1.0.0';
const W=360,H=700;
const FIELD_TOP=56, FLOOR=560;
const BR=6.5, SPEED=600;
const BASE_SHOTS=10, SHOT_STEP=2, BASE_BALLS=3, BASE_BAG=2, BASE_POCKET=1;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,dpr=1,ox=0,oy=0,vw=360,vh=700;
// 화면 맞춤: 판(360×700)을 화면에 꽉 차게 키우고, 남는 곳은 배경을 이어 칠한다
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  vw=innerWidth;vh=innerHeight;
  scale=Math.min(vw/W,vh/H);
  ox=(vw-W*scale)/2;oy=(vh-H*scale)/2;
  cv.style.width=vw+'px';cv.style.height=vh+'px';
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
  bgCanvas=null;
}
addEventListener('resize',resize);
// 판 바깥까지 포함한 화면 전체(논리 좌표)
const VL=()=>-ox/scale, VR=()=>W+ox/scale, VT=()=>-oy/scale, VB=()=>H+oy/scale;
function fullRect(col){ctx.fillStyle=col;ctx.fillRect(VL(),VT(),VR()-VL(),VB()-VT());}

// ================= 저장 =================
let save={chips:0,shotLv:0,ballLv:0,pocketLv:0,bagLv:0,luckLv:0,bait:false,legends:{},equipLegend:null,seenLegend:false,cleared:{},mission:0,plays:0,fbAsked:false};
try{const s2=JSON.parse(localStorage.getItem('snow_save_v2')||'null');if(s2)save=Object.assign(save,s2);}catch(e){}
function persist(){try{localStorage.setItem('snow_save_v2',JSON.stringify(save));}catch(e){}}

// ================= 분석 이벤트 (game-analytics-funnel) =================
const T0=Date.now();
const EV_KEY='sb_events',UID_KEY='sb_uid',FIRST_KEY='sb_first';
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
const UID=lsGet(UID_KEY)||(()=>{const u='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);lsSet(UID_KEY,u);return u;})();
const SID='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const kstDay=ms=>Math.floor((ms+9*3600e3)/86400e3);
let evSeq=0,evBuf=[];try{evBuf=JSON.parse(lsGet(EV_KEY)||'[]');}catch(e){evBuf=[];}
const platform=()=>(window.SBToss&&window.SBToss.env!=='web')?'toss':'web';
function track(name,params){
  const first=+(lsGet(FIRST_KEY)||T0);
  const ev={name,ts:Date.now(),seq:++evSeq,sid:SID,uid:UID,build:BUILD,platform:platform(),lang:'ko',screen:state,day:kstDay(Date.now())-kstDay(first),mission:curMission+1};
  if(params)for(const k in params)if(params[k]!==undefined)ev[k]=params[k];
  try{evBuf.push(ev);if(evBuf.length>300)evBuf=evBuf.slice(-300);evDirty=true;}catch(e){}
  try{if(window.SBToss){const p={};for(const k in ev)if(k!=='name')p[k]=ev[k];window.SBToss.log(name,p);}}catch(e){}
  try{if(window.gtag)window.gtag('event',name,ev);if(window.dataLayer)window.dataLayer.push({event:name,...ev});}catch(e){}
  try{if(window.PT&&PT_ON&&PT_KEYS.includes(name))PT.event(name,ev);}catch(e){}
  if(evPanel)drawEvPanel();
}
let evDirty=false;
function flushEvents(){if(evDirty){evDirty=false;lsSet(EV_KEY,JSON.stringify(evBuf));}}
setInterval(flushEvents,4000);
let evPanel=null;
function drawEvPanel(){evPanel.textContent=evBuf.slice(-14).map(e=>`${e.seq} ${e.name} ${e.screen}`).join('\n');}
if(/#events/.test(location.hash)){evPanel=document.createElement('div');evPanel.id='evp';document.body.appendChild(evPanel);}
// 앱을 떠나고 돌아오기
let bgAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){if(!bgAt){bgAt=Date.now();track('app_background',{session_s:Math.round((Date.now()-T0)/1000),in_match:inMission()?1:0,shots_left:inMission()?shotsLeft:undefined});flushEvents();if(window.PT)PT.flush&&PT.flush(true);}}
  else if(bgAt){track('app_foreground',{away_s:Math.round((Date.now()-bgAt)/1000)});bgAt=0;}
});
addEventListener('pagehide',()=>{if(!bgAt){bgAt=Date.now();track('app_background',{session_s:Math.round((Date.now()-T0)/1000),in_match:inMission()?1:0});}flushEvents();});
// 테스트 기록(playtest-kit): 테스터 링크(?t=이름)나 ?dev 일 때만 켬 — 실제 토스 유저 기록은 토스 분석으로만
const PT_ON=/[?&#](t=|dev\b)/.test(location.search+location.hash);
const PT_KEYS=['screen_view','match_start','match_complete','match_abandon','chance_offer','chance_use','legend_spawn','legend_catch','upgrade_buy','feedback_send','pause_open'];

// ================= 선배님 한마디 =================
const SB_URL='https://nrcyoqajqqbuwazlrbpa.supabase.co',SB_KEY='sb_publishable_XSDekoMOwFTaiNcrLSvYKg_fsj-XnQs';
const fbEl=document.getElementById('fb');let fbOpen=false,fbData=null;
const FB_CHIPS={
  bad:['글씨·버튼이 작아요','뭘 해야 할지 몰랐어요','너무 어려워요','금방 지루해요','조준이 잘 안 돼요'],
  good:['눈덩이 터지는 맛','왕눈사람 잡는 재미','업그레이드 모으는 재미','그림·소리가 좋아요'],
};
const BOW_SVG='<svg class="bow" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="56" r="22" fill="#fff" stroke="#a9c3e6" stroke-width="2"/><g transform="rotate(-18 42 40)"><circle cx="42" cy="30" r="16" fill="#fff" stroke="#a9c3e6" stroke-width="2"/><circle cx="36" cy="29" r="2" fill="#222"/><circle cx="48" cy="29" r="2" fill="#222"/><path d="M42 33 l10 2 -10 2z" fill="#ff8a2a"/><path d="M37 38 q5 3 10 0" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M29 18 h26 l-4 -12 h-18z" fill="#d6303a"/></g></svg>';
function fbRender(step){
  const g=fbData;let h='<div class="card">'+BOW_SVG;
  if(step===1){
    h+='<h2>선배님, 잠깐 한 말씀만 여쭤도 될까요?</h2><p>저는 이 게임을 혼자 만들고 있는 개발자입니다. 아직 부족한 점이 많아, 선배님 한마디가 가장 큰 공부가 됩니다.</p>'
     +'<div class="row"><button class="good" data-mood="good">😊 좋았어요</button><button class="meh" data-mood="meh">🙂 그저 그래요</button><button class="bad" data-mood="bad">😣 불편했어요</button><button class="later" data-act="later">다음에 할게요</button></div>';
  } else if(step===2){
    const good=g.mood==='good',list=good?FB_CHIPS.good:FB_CHIPS.bad;
    h+=`<h2>${good?'무엇이 제일 좋으셨어요?':'어디가 제일 아쉬우셨어요?'}</h2><p>하나만 골라 주셔도 충분합니다.</p><div class="chips">`+list.map(c=>`<button data-chip="${c}">${c}</button>`).join('')+'</div><div class="row"><button class="later" data-act="skipchip">고르기 어려워요</button></div>';
  } else if(step===3){
    h+='<h2>더 하실 말씀이 있으면 편하게 적어 주세요.</h2><p class="small">안 적으셔도 괜찮습니다. 전화번호 같은 개인 정보는 적지 말아 주세요.</p><textarea id="fbNote" maxlength="200" placeholder="한 줄이면 충분해요"></textarea><div class="row"><button class="main" data-act="send">보내기</button><button class="later" data-act="send0">이대로 보내기</button></div>';
  } else {
    h+='<h2>귀한 말씀 고맙습니다.</h2><p>꼭 읽고 하나씩 고쳐 나가겠습니다.</p><div class="row"><button class="main" data-act="close">닫기</button></div>';
  }
  fbEl.innerHTML=h+'</div>';fbEl.hidden=false;
}
function openFeedback(via){
  if(fbOpen)return;fbOpen=true;paused=paused||inMission();aim=null;
  fbData={via,screen:state,mood:null,chip:null};fbRender(1);track('feedback_open',{via});
}
function closeFeedback(why){fbEl.hidden=true;fbEl.innerHTML='';fbOpen=false;if(why)track('feedback_close',{why,step:fbData&&fbData.mood?(fbData.chip?3:2):1});}
function sendFeedback(note){
  const g=fbData,row={app:'snowman-breaker',version:BUILD,screen:String(g.screen).slice(0,40),mood:g.mood,chip:g.chip,note:note?note.slice(0,200):null,anon_id:UID.slice(0,40),platform:platform()};
  track('feedback_send',{mood:g.mood,chip:g.chip,has_note:note?1:0,via:g.via});
  if(g.chip)lsSet('sb_fb_chip',g.chip);
  try{fetch(SB_URL+'/rest/v1/senior_feedback',{method:'POST',keepalive:true,headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)})
    .then(r=>{if(!r.ok)stashFb(row);},()=>stashFb(row));}catch(e){stashFb(row);}
  fbRender(4);setTimeout(()=>{if(fbOpen)closeFeedback();},2400);
}
function stashFb(row){try{const o=JSON.parse(lsGet('sb_fb_out')||'[]');o.push(row);lsSet('sb_fb_out',JSON.stringify(o.slice(-5)));}catch(e){}}
function retryFb(){try{const o=JSON.parse(lsGet('sb_fb_out')||'[]');if(!o.length)return;lsSet('sb_fb_out','[]');
  fetch(SB_URL+'/rest/v1/senior_feedback',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(o)}).then(r=>{if(!r.ok)lsSet('sb_fb_out',JSON.stringify(o));},()=>lsSet('sb_fb_out',JSON.stringify(o)));}catch(e){}}
fbEl.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;sfx.click();
  if(b.dataset.mood){fbData.mood=b.dataset.mood;fbRender(2);return;}
  if(b.dataset.chip){fbData.chip=b.dataset.chip;fbRender(3);return;}
  const a=b.dataset.act;
  if(a==='later'){closeFeedback('later');return;}
  if(a==='skipchip'){fbRender(3);return;}
  if(a==='send'){const n=(document.getElementById('fbNote')||{}).value||'';sendFeedback(n.trim());return;}
  if(a==='send0'){sendFeedback('');return;}
  if(a==='close'){closeFeedback();return;}
});
fbEl.addEventListener('pointerdown',e=>e.stopPropagation());
const UPG_COSTS=[1,1,1,1,1,2,2,3,3,4]; // 처음 다섯 칸은 원작대로 1개, 그 뒤로 숫자가 커진다
const UPG={shot:{costs:UPG_COSTS,label:'샷 수'},ball:{costs:UPG_COSTS,label:'한 번에'},pocket:{costs:UPG_COSTS,label:'눈뭉치 주머니'},bag:{costs:UPG_COSTS,label:'구슬 주머니'}};
const bagCap=()=>BASE_BAG+(save.bagLv||0);
// 전설 좀비 & 전설 공
const LEGENDS={
  bowling:{zombie:'눈사람 장인',ball:'대왕 눈덩이',bait:'군고구마',
    desc:'굴러가며 커지고, 요새를 뚫고 지나감',line:'"눈은 굴려야 제맛이지."',hp:6},
};
const LEGEND_BASE=.15, LUCK_STEP=0, BAIT_BONUS=.45;
function legendChance(){ if(!save.seenLegend)return 1; return Math.min(.95,LEGEND_BASE+save.luckLv*LUCK_STEP+(save.bait?BAIT_BONUS:0)); }

  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();

}

function makeGroup(d){

      while(ci<caps.length-1){const L=Math.hypot(caps[ci][2]-caps[ci][0],caps[ci][3]-caps[ci][1]);if(s<=L)break;s-=L;ci++;}
      const c=caps[ci],L=Math.hypot(c[2]-c[0],c[3]-c[1])||1,ux=(c[2]-c[0])/L,uy=(c[3]-c[1])/L;

function closestOnSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let u=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;u=Math.max(0,Math.min(1,u));
  return [ax+dx*u,ay+dy*u];
}
function groupDist(g,x,y){
  let best=1e9,bp=null;
  for(const c of g.caps){const p=closestOnSeg(x,y,c[0],c[1],c[2],c[3]);const d=Math.hypot(x-p[0],y-p[1]);if(d<best){best=d;bp=p;}}
  return [best,bp];
}

  c.scale(1-breathe*.035,1+breathe*.035);
  // 던지는 팔 (몸 뒤)

  if(type==='wolf'){c.fillStyle=hat;c.beginPath();c.arc(0,-s*.16,s*.37,Math.PI*.95,Math.PI*2.05);fs(c,lw);c.fillStyle='#fff3e0';c.beginPath();c.arc(0,-s*.16,s*.34,Math.PI*1.08,Math.PI*1.92);c.lineTo(0,-s*.16);c.fill();
    c.fillStyle='#ffdcbf';c.beginPath();c.arc(0,-s*.13,s*.24,0,7);fs(c,lw*.8);
    if(!blink){c.fillStyle=INK;c.beginPath();c.arc(-s*.08+ex,-s*.14,s*.04,0,7);c.arc(s*.08+ex,-s*.14,s*.04,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(-s*.09+ex,-s*.16,s*.013,0,7);c.arc(s*.07+ex,-s*.16,s*.013,0,7);c.fill();}
    c.strokeStyle='#8a3b2b';c.lineWidth=s*.04;c.beginPath();c.arc(0,-s*.06,s*.05,.2,Math.PI-.2);c.stroke();}
  c.restore();
}
function drawBossBody(g){ // 왕눈사람
  const [x,y]=g.caps[0],s=g.r*1.25;
  ctx.save();ctx.translate(x,y);const sq=1+g.squash*.08;ctx.scale(sq,2-sq);
  ctx.fillStyle='#ffffff';ctx.strokeStyle='#a9c3e6';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,s*.28,s*.48,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(0,-s*.3,s*.34,0,7);ctx.fill();ctx.stroke();
  // 나뭇가지 팔
  ctx.strokeStyle='#6b4a2a';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-s*.42,s*.1);ctx.lineTo(-s*.85,-s*.2);ctx.moveTo(-s*.7,-s*.1);ctx.lineTo(-s*.78,-s*.32);ctx.moveTo(s*.42,s*.1);ctx.lineTo(s*.85,-s*.25);ctx.moveTo(s*.7,-s*.13);ctx.lineTo(s*.8,0);ctx.stroke();
  // 양동이 모자
  ctx.fillStyle='#d6303a';ctx.beginPath();ctx.moveTo(-s*.28,-s*.55);ctx.lineTo(s*.28,-s*.55);ctx.lineTo(s*.2,-s*.88);ctx.lineTo(-s*.2,-s*.88);ctx.closePath();ctx.fill();

  ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-s*.22,-s*.48);ctx.lineTo(-s*.05,-s*.42);ctx.moveTo(s*.22,-s*.48);ctx.lineTo(s*.05,-s*.42);ctx.stroke();
  ctx.fillStyle='#ff8a2a';ctx.beginPath();ctx.moveTo(0,-s*.3);ctx.lineTo(s*.3,-s*.25);ctx.lineTo(0,-s*.21);ctx.fill();
  ctx.fillStyle='#222';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(i*s*.06,-s*.12+Math.abs(i)*-s*.02,s*.025,0,7);ctx.fill();}
  // 단추
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,s*.05+i*s*.17,s*.04,0,7);ctx.fill();}

  ctx.restore();

function drawGroup(g){
  const pop=Math.min(1,Math.max(0,g.born)/.25);if(pop<=0)return;
  const e=pop<1?1+Math.sin(pop*Math.PI)*.15:1;const [lx,ly]=labelPos(g);
  ctx.save();
  ctx.translate(lx,ly);const sq=1+g.squash*.07;ctx.scale(e*sq*pop,e*(2-sq)*pop);ctx.translate(-lx,-ly);
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.save();ctx.translate(3,5);ctx.strokeStyle='rgba(5,15,40,.35)';ctx.lineWidth=g.r*2+6;ctx.beginPath();for(const c of g.caps){ctx.moveTo(c[0],c[1]);ctx.lineTo(c[2]+.01,c[3]);}ctx.stroke();ctx.restore();
  const path=()=>{ctx.beginPath();for(const c of g.caps){ctx.moveTo(c[0],c[1]);ctx.lineTo(c[2]+.01,c[3]);}};
  ctx.strokeStyle=g.flash>0?'#7fb3ee':g.legend?`hsl(${45+Math.sin(t*6)*10},100%,${55+Math.sin(t*8)*12}%)`:'#8fb2dc';ctx.lineWidth=g.r*2+(g.legend?8:5);path();ctx.stroke();
  ctx.strokeStyle=g.flash>0?'#dcecff':g.legend?'#fff3d0':(g.boss?'rgba(240,247,255,.85)':'#f4f8ff');ctx.lineWidth=g.r*2;path();ctx.stroke();
  ctx.strokeStyle='rgba(160,195,235,.45)';ctx.lineWidth=g.r*.9;ctx.beginPath();for(const c of g.caps){ctx.moveTo(c[0]+g.r*.25,c[1]+g.r*.35);ctx.lineTo(c[2]+g.r*.25+.01,c[3]+g.r*.35);}ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=g.r*.5;ctx.beginPath();for(const c of g.caps){ctx.moveTo(c[0]-g.r*.3,c[1]-g.r*.4);ctx.lineTo(c[2]-g.r*.3+.01,c[3]-g.r*.4);}ctx.stroke();
  if(g.boss){ctx.restore();drawBossBody(g);}
  else if(g.legend){ctx.restore();drawLegendBody(g);}
  else{const ox=g.caps[0][0],oy=g.caps[0][1];KID_FLINCH=Math.max(g.flash*10,g.squash);for(const z of g.zs)drawZombie(ctx,ox+z.ox,oy+z.oy,g.zsize,g.type,z.ph);KID_FLINCH=0;ctx.restore();}
  ctx.save();ctx.font=`${g.boss?30:20}px Jua, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=5;ctx.strokeStyle='#123';const ny=g.boss?ly-g.r*.55:g.legend?ly-g.r-12:ly;
  ctx.strokeText(g.hp,lx,ny);ctx.fillStyle='#fff';ctx.fillText(g.hp,lx,ny);ctx.restore();
  if(g.plus){const c=g.caps[g.caps.length-1];drawChip(c[2]+g.r*.6,c[3]+g.r*.55,8);}
}
function drawLegendBody(g){ // 눈사람 장인
  const [x,y]=g.caps[0],s=g.r*1.15;
  ctx.save();ctx.translate(x,y);const sq=1+g.squash*.1;ctx.scale(sq,2-sq);
  if(g.fleeing)ctx.scale(g.fleeDir,1);

  ctx.fillStyle='#fff';ctx.strokeStyle='#a9c3e6';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(s*.42,s*.3,s*.32,0,7);ctx.fill();ctx.stroke();

  ctx.fillStyle='#f5c518';ctx.beginPath();ctx.ellipse(-s*.08,s*.3,s*.32,s*.3,0,0,7);ctx.fill();
  ctx.fillStyle='#ff7a2a';ctx.fillRect(-s*.36,-s*.02,s*.56,s*.12);ctx.fillRect(-s*.3,s*.06,s*.12,s*.3);
  // 얼굴 + 고글
  ctx.fillStyle='#ffdcbf';ctx.beginPath();ctx.arc(-s*.08,-s*.22,s*.3,0,7);ctx.fill();
  ctx.fillStyle='#3a4a6a';roundRect(ctx,-s*.34,-s*.34,s*.52,s*.16,s*.08);ctx.fill();
  ctx.fillStyle='#8fd3ff';ctx.beginPath();ctx.arc(-s*.2,-s*.26,s*.06,0,7);ctx.arc(s*.04,-s*.26,s*.06,0,7);ctx.fill();
  ctx.strokeStyle='#8a3b2b';ctx.lineWidth=s*.04;ctx.beginPath();ctx.arc(-s*.08,-s*.1,s*.08,.2,Math.PI-.2);ctx.stroke();
  // 방울 털모자 + 왕관
  ctx.fillStyle='#2b5fb8';ctx.beginPath();ctx.arc(-s*.08,-s*.36,s*.28,Math.PI,0);ctx.fill();
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(-s*.26,-s*.6);ctx.lineTo(-s*.26,-s*.8);ctx.lineTo(-s*.16,-s*.68);ctx.lineTo(-s*.08,-s*.86);ctx.lineTo(0,-s*.68);ctx.lineTo(s*.1,-s*.8);ctx.lineTo(s*.1,-s*.6);ctx.fill();

  }
}
function drawChip(x,y,r){ // 구슬

  const g2=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);g2.addColorStop(0,'#c9f0ff');g2.addColorStop(.6,'#2f8cff');g2.addColorStop(1,'#1b4fb8');

  ctx.strokeStyle='rgba(255,210,63,.9)';ctx.lineWidth=r*.22;ctx.beginPath();ctx.arc(x,y,r*.55,-.6,1.8);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(x-r*.35,y-r*.35,r*.22,0,7);ctx.fill();

function drawSnowball(x,y,r,big){

  ctx.fillStyle='rgba(170,200,240,.6)';ctx.beginPath();ctx.arc(x+r*.25,y+r*.25,r*.65,0,7);ctx.fill();

function drawAim(){
  if(!aim||!aim.dir||state!=='aim')return;
  let x=shooterX,y=FLOOR-8,dx=aim.dir[0],dy=aim.dir[1],pts=[[x,y]],segLen=[0],len=0,seg=0;
  while(len<1200){
    x+=dx*3;y+=dy*3;len+=3;segLen[seg]+=3;
    let hit=false;
    if(x<BR){x=BR;dx=-dx;hit=true;}if(x>W-BR){x=W-BR;dx=-dx;hit=true;}if(y<FIELD_TOP+BR){y=FIELD_TOP+BR;dy=-dy;hit=true;}
    if(!bowlArmed)for(const g of groups){if(g.born<0||g.fleeing)continue;const [d,p]=groupDist(g,x,y);if(d<g.r+BR){const nx=(x-p[0])/d,ny=(y-p[1])/d,vn=dx*nx+dy*ny;if(vn<0){dx-=2*vn*nx;dy-=2*vn*ny;}hit=true;break;}}
    if(y>FLOOR)break;
    if(seg===1&&segLen[1]>70)break;   // 반사 후 짧게만
    if(hit){if(seg===1)break;pts.push([x,y]);seg=1;segLen[1]=0;}
  }
  pts.push([x,y]);
  ctx.save();
  for(let i=0;i<pts.length-1;i++){
    const [ax,ay]=pts[i],[bx,by]=pts[i+1],L=Math.hypot(bx-ax,by-ay),n=Math.floor(L/12);
    for(let k=0;k<=n;k++){const u=k/Math.max(1,n);
      ctx.fillStyle=i===0?'rgba(255,255,255,.92)':`rgba(255,255,255,${.5*(1-u)})`;
      ctx.beginPath();ctx.arc(ax+(bx-ax)*u,ay+(by-ay)*u,i===0?2.6:2,0,7);ctx.fill();}
  }
  ctx.restore();
}

function drawPin(x,y,s){ // 군고구마

  txt('다음 동네는 곧 열려요',W/2,670,15,'#6c76a0','center');
}
function drawLobby(){
  lobbyBtns=[];
  fullRect('rgba(10,14,35,.8)');
  headerBar(`${curMission+1}. ${MISSION.name}`,()=>go('map'));
  // 미션 카드
  const c=legendChance(),st=chanceStars(c),d=MISSION_DEFS[curMission];
  ctx.fillStyle='#3f6fc4';roundRect(ctx,12,64,W-24,74,16);ctx.fill();
  txt(`끝까지 버티고 왕눈사람(체력 ${d.boss}) 잡기`,26,86,17,'#fff');
  txt('전설 출현',26,116,16,'#ffe066');
  for(let k=0;k<3;k++){ctx.fillStyle=k<st?'#ffd23f':'rgba(255,255,255,.25)';star(116+k*22,116,9);}
  txt(save.seenLegend?'눈사람 장인이 골목에 나온대':'첫 판엔 꼭 나타나요',176,116,15,'#e8eeff');
  // 미끼
  const by=146;ctx.fillStyle=save.bait?'#4a3a12':'#252b4d';roundRect(ctx,12,by,W-24,62,16);ctx.fill();
  if(save.bait){ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;roundRect(ctx,12,by,W-24,62,16);ctx.stroke();}
  drawPin(40,by+31,24);
  txt('미끼: 군고구마',66,by+20,18,'#fff');
  txt('장인 출현↑ 대신 애들도 더 몰려옴',66,by+44,14.5,'#ffcf8a');
  pill(W-78,by+15,58,32,save.bait?'#ffd23f':'#3b4270');txt(save.bait?'켬':'끔',W-49,by+31,17,save.bait?'#3a2a00':'#c7cdf0','center');
  lobbyBtns.push({r:[12,by,W-24,62],fn:()=>{save.bait=!save.bait;persist();sfx.click();track('bait_toggle',{on:save.bait?1:0});}});
  // 전설 공
  const ly=216;ctx.fillStyle='#252b4d';roundRect(ctx,12,ly,W-24,62,16);ctx.fill();
  const lv=save.legends.bowling||0;
  if(lv){const on=save.equipLegend==='bowling';
    if(on){ctx.strokeStyle='#8dff6a';ctx.lineWidth=3;roundRect(ctx,12,ly,W-24,62,16);ctx.stroke();}
    drawItemIcon('bowling',40,ly+31,24);txt(`대왕 눈덩이 Lv.${lv}`,66,ly+20,18,'#fff');
    txt(`샷마다 첫 공 · ${3+lv}명까지 뚫음`,66,ly+44,14.5,'#c7cdf0');
    pill(W-78,ly+15,58,32,on?'#8dff6a':'#3b4270');txt(on?'장착':'해제',W-49,ly+31,16,on?'#123':'#c7cdf0','center');
    lobbyBtns.push({r:[12,ly,W-24,62],fn:()=>{save.equipLegend=on?null:'bowling';persist();sfx.click();track('legend_equip',{on:on?0:1});}});
  } else {
    ctx.globalAlpha=.5;drawItemIcon('bowling',40,ly+31,24);ctx.globalAlpha=1;
    txt('전설 공: ???',66,ly+20,18,'#9aa3c8');txt('눈사람 장인을 맞히면 얻어요',66,ly+44,14.5,'#9aa3c8');
  }
  // 업그레이드 (원작 4줄)
  txt('업그레이드 · 구슬로 키워요',16,298,17,'#ffe066');
  const rows=[['shot','shotLv',lv=>BASE_SHOTS+lv*SHOT_STEP,'번','판마다 쏠 수 있는 횟수'],
              ['ball','ballLv',lv=>BASE_BALLS+lv,'개','한 번 쏠 때 날아가는 눈뭉치'],
              ['pocket','pocketLv',lv=>BASE_POCKET+lv,'칸','판 안에서 주운 눈뭉치를 담는 칸'],
              ['bag','bagLv',lv=>BASE_BAG+lv,'칸','판마다 가져올 수 있는 구슬']];
  rows.forEach(([key,lvk,val,unit,desc],i)=>{
    const y=314+i*64,u=UPG[key],lv=save[lvk]||0,max=u.costs.length,cost=u.costs[lv];
    ctx.fillStyle='#252b4d';roundRect(ctx,12,y,W-24,58,14);ctx.fill();
    txt(u.label,24,y+19,18,'#fff');
    txt(lv>=max?`${val(lv)}${unit} (최대)`:`${val(lv)}${unit} → ${val(lv+1)}${unit}`,24+ctx.measureText(u.label).width+10,y+19,16,'#9fd0ff');
    txt(desc,24,y+42,14.5,'#9aa3c8');
    const bx=W-92,ok=lv<max&&save.chips>=cost;
    ctx.fillStyle=lv>=max?'#3b4270':ok?'#2f8cff':'#3b4270';roundRect(ctx,bx,y+8,72,42,12);ctx.fill();
    if(lv>=max)txt('최대',bx+36,y+29,16,'#9aa3c8','center');
    else{drawChip(bx+20,y+29,9);txt(`×${cost}`,bx+48,y+29,18,ok?'#fff':'#9aa3c8','center');}
    lobbyBtns.push({r:[bx-6,y,84,58],fn:()=>{if(ok){save.chips-=cost;save[lvk]=lv+1;persist();sfx.chip();track('upgrade_buy',{key,lv:lv+1,chips_left:save.chips});}else{sfx.full();if(lv<max)texts.push({x:W/2,y:y,txt:'구슬이 모자라요',life:1,c:'#ff9a9a'});}}});
  });
  for(const x of texts){ctx.save();ctx.globalAlpha=Math.min(1,x.life*2);txt(x.txt,x.x,x.y,18,x.c,'center');ctx.restore();}
  const sb=[W/2-130,582,260,64];
  bigBtn(sb,'시작!','#ffd23f','#3a2a00',28);
  lobbyBtns.push({r:sb,fn:()=>{sfx.click();startMission(curMission);}});
  txt('져도 모은 구슬은 가져가요',W/2,668,15,'#8a93b8','center');
}

let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(!paused)update(dt);else t+=0;render();requestAnimationFrame(loop);}
resize();
window.SBFontsReady=()=>{bgCanvas=null;};
try{document.fonts.load('20px Jua','눈사람').then(()=>{bgCanvas=null;});}catch(e){}
// 부팅 이벤트
(function boot(){
  const isFirst=!lsGet(FIRST_KEY);if(isFirst)lsSet(FIRST_KEY,String(T0));
  const q=new URLSearchParams(location.search),utm={};['utm_source','utm_medium','utm_campaign','utm_content'].forEach(k=>{const v=q.get(k);if(v)utm[k]=v.slice(0,80);});
  let ref='';try{ref=document.referrer?new URL(document.referrer).host:'';}catch(e){}
  const n=(+lsGet('sb_sessions')||0)+1;lsSet('sb_sessions',String(n));
  setTimeout(()=>{ // 토스 모듈(window.SBToss)이 붙을 시간을 조금 준다
    if(isFirst)track('first_open',{...utm,ref});
    track('app_open',{first:isFirst?1:0,session_no:n,...utm});
    track('loading_complete',{ms:Math.round(performance.now())});
    track('title_view',{state:loadResume()?'resume':save.plays?'returning':'new'});
  },300);
  if(PT_ON&&window.PT)PT.init({game:'snowman-breaker',build:BUILD,lang:'ko',endpoint:SB_URL,key:SB_KEY,maxPulses:3,gapMs:60000,strings:{thanks:'고마워요.',skip:'×'}});
  setTimeout(retryFb,3000);
})();
requestAnimationFrame(loop);
